<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T6X87</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
html, body {
  background-color: #fafafa;
  font-family: 'Inter', sans-serif;
  color: #111;
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  overflow-y: hidden; /* prevent vertical scroll */
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center; /* center horizontally */
  padding: 40px 20px;
  max-height: 100%;
  box-sizing: border-box;
}

.image-text-wrapper {
  max-width: 340px;
  width: 100%;
  text-align: left;
  position: relative;
}

.image-text-wrapper h1 {
  font-weight: 500;
  font-size: 2rem;
  letter-spacing: 0.5px;
  margin: 0 0 24px 0;
  z-index: 2;
  position: relative;
}

/* Slideshow container to stack images for crossfade */
.slideshow-container {
  position: relative;
  width: 100%;
  height: 450px; /* updated height */
  overflow: hidden;
  margin-bottom: 24px;
}

.profile {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

/* Links aligned to the left edge of the image/title wrapper */
.links {
  display: flex;
  justify-content: flex-start;
  gap: 12px;
  width: 100%;
  flex-wrap: nowrap;
  margin-top: 0;
}

.links a {
  text-decoration: none;
  color: #111;
  font-size: 0.85rem; /* fit on one line */
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition: color 0.2s ease;
}

.links a:hover {
  color: #888;
}
</style>
</head>

<body>
<div class="container">
  <div class="image-text-wrapper">
    <h1>T6X87</h1>
    <div class="slideshow-container">
      <!-- Each image is stacked for crossfade -->
      <img class="profile" src="https://pbs.twimg.com/media/GzoNx7CXAAAdjhP.jpg" alt="Slideshow image">
      <img class="profile" src="https://pbs.twimg.com/media/GxGYhTAXUAAlhO8.jpg" alt="Slideshow image">
      <img class="profile" src="https://pbs.twimg.com/media/GuDmFx1WwAArkAH.jpg" alt="Slideshow image">
      <img class="profile" src="https://pbs.twimg.com/media/Gorn9BWWEAA1CNv.jpg" alt="Slideshow image">
      <img class="profile" src="https://pbs.twimg.com/media/GoWmzWzW0AAAlcq.jpg" alt="Slideshow image">
      <img class="profile" src="https://pbs.twimg.com/media/Ggz2YvTWcAIBRrT.jpg" alt="Slideshow image">
      <img class="profile" src="https://pbs.twimg.com/media/GYgfJIqWwAACZn_.jpg" alt="Slideshow image">
    </div>
    <div class="links">
      <a href="https://onlyfans.com/T6X87" target="_blank">OnlyFans</a>
      <a href="https://twitter.com/T6X87" target="_blank">Twitter/X</a>
      <a href="https://instagram.com/T6X87" target="_blank">Instagram</a>
      <a href="https://www.amazon.co.uk/hz/wishlist/ls/23B45Z7AUU74W?ref_=wl_share" target="_blank">Wishlist</a>
      <a href="https://t6x87.substack.com/" target="_blank">Substack</a>
      <a href="mailto:T6X87@protonmail.com" target="_blank">Email</a>
    </div>
  </div>
</div>

<script>
const slides = document.querySelectorAll('.slideshow-container .profile');
let current = 0;
slides[current].style.opacity = 1; // show first image

setInterval(() => {
  const prev = current;
  current = (current + 1) % slides.length;
  slides[current].style.opacity = 1; // fade in next
  slides[prev].style.opacity = 0;    // fade out previous
}, 1500); // 1.5s per image
</script>
</body>
</html>
