<style>
html, body {
  background-color: #fafafa;
  font-family: 'Inter', sans-serif;
  color: #111;
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  overflow-y: hidden; /* prevent vertical scroll */
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 20px;
  max-height: 100%;
  box-sizing: border-box;
}

.image-text-wrapper {
  max-width: 340px;
  width: 100%;
  text-align: left;
  position: relative;
}

.image-text-wrapper h1 {
  font-weight: 500;
  font-size: 4rem; /* doubled size */
  letter-spacing: 0.5px;
  margin: 0 0 24px 0;
  z-index: 2;
  position: relative;
}

.slideshow-container {
  position: relative;
  width: 100%;
  height: 450px; /* fixed height as before */
  overflow: hidden;
  margin-bottom: 24px;
}

.profile {
  width: 100%;
  height: 100%;
  object-fit: cover; /* keeps image filling container without resizing */
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

.links {
  display: flex;
  justify-content: flex-start;
  gap: 12px;
  width: 100%;
  flex-wrap: nowrap;
  margin-top: 0;
}

.links a {
  text-decoration: none;
  color: #111;
  font-size: clamp(0.7rem, 2vw, 0.85rem); /* responsive font for mobile */
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition: color 0.2s ease;
}

.links a:hover {
  color: #888;
}
</style>
</head>

<body>
<div class="container">
  <div class="image-text-wrapper">
    <h1>T6X87</h1>
    <div class="slideshow-container" aria-label="T6X87 slideshow of images">
      <img class="profile" src="https://pbs.twimg.com/media/GzoNx7CXAAAdjhP.jpg" alt="T6X87 profile photo 1">

    </div>
    <div class="links">
      <a href="https://onlyfans.com/T6X87" target="_blank">OnlyFans</a>
      <a href="https://twitter.com/T6X87" target="_blank">Twitter/X</a>
      <a href="https://instagram.com/T6X87" target="_blank">Instagram</a>

      <a href="mailto:T6X87@protonmail.com" target="_blank">Email</a>
    </div>
  </div>
</div>

<script>
const slides = document.querySelectorAll('.slideshow-container .profile');
let current = 0;
slides[current].style.opacity = 1; // show first image

setInterval(() => {
  const prev = current;
  current = (current + 1) % slides.length;
  slides[current].style.opacity = 1; // fade in next
  slides[prev].style.opacity = 0;    // fade out previous
}, 1500);
</script>
</body>
