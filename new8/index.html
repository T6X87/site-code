<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T6X87</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  background-color: #fafafa;
  font-family: 'Inter', sans-serif;
  color: #111;
  margin: 0;
  padding: 0;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center; /* centers the block horizontally */
  padding: 60px 20px;
}

.image-text-wrapper {
  max-width: 340px; /* image width */
  width: 100%;
  text-align: left; /* title and links left-aligned relative to image */
}

.image-text-wrapper h1 {
  font-weight: 500;
  font-size: 2rem;
  letter-spacing: 0.5px;
  margin: 0 0 24px 0;
}

.profile {
  width: 100%;
  height: 450px; /* fixed height to prevent jumps */
  object-fit: cover; /* maintain aspect ratio, crop if necessary */
  display: block;
  margin-bottom: 24px;
  transition: opacity 0.8s ease-in-out;
  opacity: 1;
}

/* Links aligned to the left edge of the image/title wrapper */
.links {
  display: flex;
  justify-content: flex-start;
  gap: 12px;
  margin-top: 10px;
  width: 100%;
  flex-wrap: nowrap; /* keep in one line */
}

.links a {
  text-decoration: none;
  color: #111;
  font-size: 0.85rem; /* slightly smaller to fit in one line */
  letter-spacing: 0.5px;
  transition: color 0.2s ease;
  white-space: nowrap;
}

.links a:hover {
  color: #888;
}

footer {
  margin-top: 60px;
  font-size: 0.8rem;
  color: #777;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">
  <div class="image-text-wrapper">
    <h1>T6X87</h1>
    <img id="slideshow" class="profile" src="https://pbs.twimg.com/media/GzoNx7CXAAAdjhP.jpg" alt="Profile image">
    
    <div class="links">
      <a href="https://onlyfans.com/T6X87" target="_blank">OnlyFans</a>
      <a href="https://twitter.com/T6X87" target="_blank">Twitter/X</a>
      <a href="https://instagram.com/T6X87" target="_blank">Instagram</a>
      <a href="https://www.amazon.co.uk/hz/wishlist/ls/23B45Z7AUU74W?ref_=wl_share" target="_blank">Wishlist</a>
      <a href="https://t6x87.substack.com/" target="_blank">Substack</a>
      <a href="mailto:T6X87@protonmail.com" target="_blank">Email</a>
    </div>
  </div>

  <footer>
    <p>© T6X87</p>
  </footer>
</div>

<script>
const images = [
  "https://pbs.twimg.com/media/GzoNx7CXAAAdjhP.jpg",
  "https://pbs.twimg.com/media/GxGYhTAXUAAlhO8.jpg",
  "https://pbs.twimg.com/media/GuDmFx1WwAArkAH.jpg",
  "https://pbs.twimg.com/media/Gorn9BWWEAA1CNv.jpg",
  "https://pbs.twimg.com/media/GoWmzWzW0AAAlcq.jpg",
  "https://pbs.twimg.com/media/Ggz2YvTWcAIBRrT.jpg",
  "https://pbs.twimg.com/media/GYgfJIqWwAACZn_.jpg"
];

let current = 0;
const slideshow = document.getElementById('slideshow');

function nextImage() {
  slideshow.style.opacity = 0;
  setTimeout(() => {
    current = (current + 1) % images.length;
    slideshow.src = images[current];
    slideshow.style.opacity = 1;
  }, 400); // fade out for 0.4s
}

setInterval(nextImage, 1500); // 1.5 seconds per image
</script>
</body>
</html>
